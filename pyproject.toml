[project]
name = "jersa-test-framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra"
markers = [
    "smoke: szybkie sprawdzenie, że element działa",
    "regression: pełny zestaw regresji",
    "contract: zgodność odpowiedzi API ze schematem",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT"]
